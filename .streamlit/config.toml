# SHOAL dashboard theme.
#
# Deliberately matched to the landing page (web/) so the demo feels like one
# product: the same cool near-black base, the single amber accent lifted from
# the BoT-SORT track overlay, Geist + Geist Mono.

[theme]
base = "dark"
primaryColor = "#ffb24a"
backgroundColor = "#0b1116"
secondaryBackgroundColor = "#141c24"
textColor = "#e6ebef"
linkColor = "#ffc987"
borderColor = "#2a363d"
showSidebarBorder = true
showWidgetBorder = true
baseRadius = "medium"
buttonRadius = "medium"
codeBackgroundColor = "#0f171e"

font = "Geist, sans-serif"
headingFont = "Geist, sans-serif"
codeFont = "Geist Mono, monospace"
headingFontWeights = [600, 600, 600, 600, 500, 500]
metricValueFontWeight = 500

# plotly / built-in charts inherit these
chartCategoricalColors = ["#ffb24a", "#61b7de", "#5bc99e", "#c98fd8", "#e7ba54", "#8891a0"]
chartSequentialColors = ["#141c24", "#3a2f1e", "#6b4f22", "#a06f26", "#d1902b", "#ffb24a"]

[[theme.fontFaces]]
family = "Geist"
url = "https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-Regular.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Geist"
url = "https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-Medium.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "Geist"
url = "https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-SemiBold.woff2"
weight = 600
style = "normal"

[[theme.fontFaces]]
family = "Geist Mono"
url = "https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/GeistMono-Regular.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Geist Mono"
url = "https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/GeistMono-Medium.woff2"
weight = 500
style = "normal"
